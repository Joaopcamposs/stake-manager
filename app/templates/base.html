<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stake Manager</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ vite.css }}">
    <script type="module" src="{{ vite.js }}"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-[Inter,sans-serif] min-h-screen">
    <nav class="sticky top-0 z-50 backdrop-blur bg-gray-900/80 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-lg font-bold text-white">
                <img src="/static/logo.svg" alt="Stake Manager" class="h-8 w-8">
                Stake Manager
            </a>
            <div class="flex items-center gap-4">
                <a href="/" class="text-sm text-gray-300 hover:text-white transition">Home</a>
                <a href="/dashboard" class="text-sm text-gray-300 hover:text-white transition">Dashboard</a>
                <a href="/settings" class="text-sm text-gray-300 hover:text-white transition">Config</a>
                <form method="post" action="/logout" class="m-0">
                    <button type="submit" class="text-sm text-gray-400 hover:text-red-400 transition">Sair</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
