services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bet}
      POSTGRES_DB: ${POSTGRES_DB:-bet_tracker}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet -d bet_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  pgdata:
